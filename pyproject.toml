[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdgap"
version = "0.1.0"
description = "Data-manifold dimension and the generalization gap of GNNs on manifold-sampled graphs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
