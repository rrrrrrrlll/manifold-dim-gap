# Robustness check of the clean-manifold result: denser graph, k = 30 (torus, MSE).
experiment: clean_torus_k30
manifolds: [torus]
m: [4, 16]
n: [250, 500, 1000, 2000, 4000, 8000, 16000]
seeds: 10
losses: [mse]
ambient_dim: 128
embed_seed: 0
noise_sigma: 0.0
k: 30
test_graphs: 5
model: {hidden_size: 32, layers: 2, dropout: 0.5, gnn_conv: GCNConv}
optim: {lr: 0.01, epochs: 2000}  # must match configs/clean_manifolds.yaml
trace_every: 0
